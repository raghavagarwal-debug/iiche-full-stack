<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Recovery Email - IIChE Student Chapter BIT Mesra</title>
    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
        <!-- High-Speed CDN & Font Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #010a08; color: #f1f5f9; }
        .text-gradient { background: linear-gradient(to right, #34d399, #22d3ee); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .liquid-glass-nav { background: linear-gradient(180deg, rgba(1, 10, 8, 0.85) 0%, rgba(2, 24, 20, 0.65) 100%); backdrop-filter: blur(28px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .login-card { background: linear-gradient(165deg, rgba(16, 34, 31, 0.95) 0%, rgba(5, 14, 12, 0.98) 100%); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85); }
    </style>
</head>
<body class="text-white flex flex-col min-h-screen bg-cover bg-center bg-no-repeat bg-fixed" style="background-image: linear-gradient(rgba(1, 10, 8, 0.65), rgba(1, 10, 8, 0.75)), url('../assets/hero_bg.webp');">
    
    <!-- Top Navigation Bar -->
    <nav id="desktop-nav" class="fixed top-4 sm:top-8 left-1/2 -translate-x-1/2 w-[92%] sm:w-[90%] max-w-7xl z-50 liquid-glass-nav rounded-2xl">
        <div class="px-4 sm:px-10 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="../assets/logo.png" alt="IIChE Logo" class="w-9 h-9 sm:w-10 sm:h-10 object-contain">
                <a href="../index.html#hero-section" class="text-lg sm:text-xl font-black tracking-tighter text-gradient">IIChE</a>
            </div>
            <div class="hidden md:flex items-center gap-6 lg:gap-10">
                <a href="../index.html" class="text-xs font-bold text-slate-300 hover:text-emerald-400 uppercase tracking-widest">Home</a>
                <a href="events.html" class="text-xs font-bold text-slate-300 hover:text-emerald-400 uppercase tracking-widest">Events</a>
                <a href="login.html" class="px-4 py-2 rounded-xl text-xs font-extrabold uppercase tracking-wider text-[#010a08] bg-gradient-to-r from-emerald-400 to-cyan-400">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center pt-24 sm:pt-32 pb-10 px-4 sm:px-6 w-full max-w-7xl mx-auto z-10">
        <div class="login-card w-full max-w-[440px] border border-[#1c3e38]/70 p-7 sm:p-9 flex flex-col rounded-[28px] relative overflow-hidden my-auto">
            <div class="relative z-10 w-full flex flex-col items-center text-center">
                
                <div class="mb-4">
                    <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                        <i data-lucide="mail-check" class="w-8 h-8"></i>
                    </div>
                </div>

                <!-- Step indicator -->
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-bold flex items-center justify-center border border-emerald-500/40">✓</span>
                    <span class="w-8 h-0.5 bg-emerald-500/40"></span>
                    <span class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 text-[10px] font-bold flex items-center justify-center border border-amber-500/40">2</span>
                    <span class="w-8 h-0.5 bg-slate-700"></span>
                    <span class="w-6 h-6 rounded-full bg-slate-800 text-slate-500 text-[10px] font-bold flex items-center justify-center border border-slate-700">3</span>
                    <span class="w-8 h-0.5 bg-slate-700"></span>
                    <span class="w-6 h-6 rounded-full bg-slate-800 text-slate-500 text-[10px] font-bold flex items-center justify-center border border-slate-700">4</span>
                </div>

                <h1 class="text-xl sm:text-2xl font-bold text-white mb-2">Verify Recovery Email</h1>
                <p class="text-xs text-slate-300 mb-6 leading-relaxed">Enter your recovery email address below. We'll verify it and send the 6-digit OTP code to that address.</p>

                <div id="alert-box" class="hidden w-full text-xs py-3 px-4 rounded-xl mb-4 text-left"></div>

                <form id="recoveryForm" class="w-full flex flex-col gap-4 text-left">
                    <div class="flex flex-col gap-1.5 w-full">
                        <label class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-[#9bb5af]" for="recovery_email">Recovery Email Address</label>
                        <input class="w-full bg-[#061412]/80 border border-[#1b3d36] rounded-xl px-4 py-3 text-xs sm:text-sm text-white placeholder:text-[#496962] focus:outline-none focus:border-[#00d2c4] transition-all" id="recovery_email" name="recovery_email" placeholder="your.recovery@gmail.com" type="email" required/>
                    </div>
                    
                    <button id="submitBtn" class="w-full bg-gradient-to-r from-[#00d2c4] via-[#10b981] to-[#06b6d4] hover:from-[#00e5d9] hover:to-[#22d3ee] text-[#02120f] font-extrabold text-xs sm:text-sm py-3.5 rounded-xl transition-all transform hover:-translate-y-0.5 mt-2 cursor-pointer" type="submit">
                        Verify & Send OTP
                    </button>
                </form>

                <div class="mt-6 w-full text-center">
                    <a class="text-xs font-bold text-[#00e5d9] hover:underline flex items-center justify-center gap-1" href="forgot-password.html">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Use a different email
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="../auth-client.js"></script>
    <script src="../responsive-nav.js"></script>
    <!-- 3D Card Hover Lift & Tilt Engine -->
    <script src="../card-3d.js"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        let resetSessionToken = sessionStorage.getItem('reset_session_token') || tokenFromUrl || '';
        if (tokenFromUrl) {
            sessionStorage.setItem('reset_session_token', tokenFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        const alertBox = document.getElementById('alert-box');

        if (!resetSessionToken) {
            alertBox.className = 'w-full text-xs py-3 px-4 rounded-xl mb-4 text-left bg-amber-500/20 text-amber-300 border border-amber-500/30';
            alertBox.innerHTML = 'Please enter your registered account email first.';
            alertBox.classList.remove('hidden');
        }

        document.getElementById('recoveryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const recoveryEmail = document.getElementById('recovery_email').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            const currentToken = resetSessionToken || sessionStorage.getItem('reset_session_token');

            if (!currentToken) {
                alertBox.className = 'w-full text-xs py-3 px-4 rounded-xl mb-4 text-left bg-red-500/20 text-red-300 border border-red-500/30';
                alertBox.innerText = 'Session expired. Please enter your account email first.';
                alertBox.classList.remove('hidden');
                setTimeout(() => { window.location.href = 'forgot-password.html'; }, 1000);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';
            alertBox.classList.add('hidden');

            try {
                const res = await window.IIChEAuth.verifyRecoveryEmail(currentToken, recoveryEmail);

                // Store recovery email for potential OTP resend
                sessionStorage.setItem('recovery_email', recoveryEmail);

                alertBox.className = 'w-full text-xs py-3 px-4 rounded-xl mb-4 text-left bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                alertBox.innerText = res.message || 'Recovery email verified! OTP sent. Redirecting...';
                alertBox.classList.remove('hidden');

                const recoveryEmailForDisplay = sessionStorage.getItem('recovery_email') || recoveryEmail;
                const targetUrl = currentToken
                    ? `verify-otp.html?token=${encodeURIComponent(currentToken)}${recoveryEmailForDisplay ? `&recovery_email=${encodeURIComponent(recoveryEmailForDisplay)}` : ''}`
                    : 'verify-otp.html';

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 500);
            } catch (err) {
                alertBox.className = 'w-full text-xs py-3 px-4 rounded-xl mb-4 text-left bg-red-500/20 text-red-300 border border-red-500/30';
                alertBox.innerText = err.message || 'Wrong recovery email. Please try again.';
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Verify & Send OTP';
            }
        });
    </script>
</body>
</html>
