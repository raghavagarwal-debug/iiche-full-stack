    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .shadow-ambient {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(40px) rotateY(-15deg) rotateX(10deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) rotateY(-5deg) rotateX(2deg);
            }
        }

        .animate-entrance {
            animation: cardEntrance 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        /* Clean Dark Glass Card with Subtle Border & Soft Depth */
        .login-card {
            position: relative;
            background: linear-gradient(165deg, rgba(16, 34, 31, 0.95) 0%, rgba(12, 26, 23, 0.96) 50%, rgba(5, 14, 12, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 25px 60px -15px rgba(0, 0, 0, 0.85),
                0 0 30px -5px rgba(0, 210, 196, 0.12),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            overflow: hidden;
        }

        .login-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 35px 75px -15px rgba(0, 0, 0, 0.9),
                0 0 35px 0 rgba(0, 210, 196, 0.2),
                inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.35);
        }

        /* Left-to-Right Single Shine Sweep (Triggers ONCE per mouse enter) */
        @keyframes shineSweep {
            0% {
                transform: translateX(-150%) skewX(-25deg);
                opacity: 0;
            }
            15% {
                opacity: 0.55;
            }
            85% {
                opacity: 0.55;
            }
            100% {
                transform: translateX(220%) skewX(-25deg);
                opacity: 0;
            }
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 70%;
            height: 140%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.01) 20%,
                rgba(255, 255, 255, 0.18) 48%,
                rgba(0, 210, 196, 0.35) 55%,
                rgba(255, 255, 255, 0.18) 62%,
                transparent 100%
            );
            transform: translateX(-150%) skewX(-25deg);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            filter: blur(1px);
        }

        .login-card:hover::after {
            animation: shineSweep 2.5s cubic-bezier(0.25, 1, 0.45, 1) forwards;
        }
    </style>
</head>

                <!-- Responsive Login Form -->
