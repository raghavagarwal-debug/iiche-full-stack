# Nginx load balancer configuration for IIChE backend
# Per Section 10: distributes traffic across multiple FastAPI replicas.

events {
    worker_connections 1024;
}

http {
    # Upstream: Docker Compose DNS resolves 'api' to all replica IPs
    upstream iiche_api {
        # Docker Compose internal DNS resolves all replicas
        server api:8000;
    }

    server {
        listen 80;

        # Security headers — Per Section 12
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Request size limit (backup to app-level middleware)
        client_max_body_size 1m;

        location / {
            proxy_pass http://iiche_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass through request ID
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint (no caching)
        location /health {
            proxy_pass http://iiche_api;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store" always;
        }

        location /ready {
            proxy_pass http://iiche_api;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store" always;
        }
    }
}
